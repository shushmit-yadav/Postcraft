# Full stack: `docker compose up --build` → http://localhost:8080
# For local development, run only Postgres (`npm run db:up`) and use `npm run dev`.

x-app: &app
  build: .
  image: postcraft:local
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  environment:
    DATABASE_URL: postgres://app:app@postgres:5432/social_gen
    APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env (cp .env.example .env)}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5-5}
    WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
  volumes:
    - storage:/app/data/storage # api serves files the worker writes, so they share it

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: social_gen
    ports:
      - "127.0.0.1:5432:5432" # local tools only; never exposed to the network
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d social_gen"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    <<: *app
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    <<: *app
    command: ["node", "dist/worker.js"]
    stop_grace_period: 40s # worker finishes in-flight jobs (up to 30s) on SIGTERM

volumes:
  pgdata:
  storage:
